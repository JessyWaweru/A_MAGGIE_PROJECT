<div style="font-family: Georgia, 'Times New Roman', serif; max-width: 520px; margin: 0 auto; padding: 32px; background: #fbf7f0; border-radius: 16px; border: 1px solid #e4d9c4;">
  <p style="text-align: center; margin: 0 0 20px;"><img src="{{ logo_url }}" alt="GOherbal" width="180" height="60" style="display: inline-block; width: 180px; height: 60px; border: 0; outline: none; font-family: Georgia, serif; font-size: 22px; font-weight: bold; color: #0e4d3a;"></p>
  <h1 style="color: #3f5d3a; text-align: center; font-size: 22px; margin: 0 0 16px;">{{ headline }}</h1>
  <p style="color: #4a4237; font-size: 15px; line-height: 1.6;">Hi {{ order.user.first_name|default:order.user.email }},</p>
  <p style="color: #4a4237; font-size: 15px; line-height: 1.6;">{{ message }}</p>
  <p style="color: #4a4237; font-size: 15px; line-height: 1.6;">
    Order <strong>#{{ order.order_number }}</strong> · {{ order.delivery_option_name }}<br>
    {{ order.shipping_address_text }}
  </p>
  {% if order.tracking_code %}
  <p style="color: #4a4237; font-size: 15px; line-height: 1.6;">Parcel code: <strong>{{ order.tracking_code }}</strong></p>
  {% endif %}
  <p style="text-align: center; margin: 28px 0 8px;">
    <a href="{{ FRONTEND_URL }}/orders/{{ order.order_number }}" style="display: inline-block; background: #587649; color: #fffdf8; text-decoration: none; padding: 12px 28px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;">Track your order</a>
  </p>
</div>
